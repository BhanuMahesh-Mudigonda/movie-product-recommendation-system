app = "moviemind-movie-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.movie"

[env]
  PYTHON_VERSION = "3.12.0"

[[services]]
  internal_port = 8000
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.http_checks]]
    interval = 10000
    grace_period = "20s"
    method = "get"
    path = "/health"
    protocol = "http"
    timeout = 2000
